[package]
name = "strauss-rs"
version = "0.1.0"
edition = "2024"
authors = ["Evo Mark Ltd <github@evomark.co.uk>"]
license-file = "LICENCE"
repository = "https://github.com/evo-mark/strauss-rs"

[features]
# Development only: the `benchmark` command, for people building from source.
# Off by default and never enabled by the release workflow.
benchmark = ["dep:libc"]

[dependencies]
php-rs-parser = "0.21"
php-ast = "0.21"
php-lexer = "0.21"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
fancy-regex = "0.19.2"
clap = { version = "4.6.7", features = ["derive"] }
ignore = "0.4.33"
globset = "0.4.20"
rayon = "1.12.0"
similar = "3.2.0"
indicatif = "0.18.6"
libc = { version = "0.2", optional = true }
